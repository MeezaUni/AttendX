[project]
name = "attendx"
version = "2.0.0"
description = "AttendX - AI-powered attendance with 1:1 face verification and active liveness (university prototype)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18",
  "safetensors>=0.4",
  "mediapipe>=0.10.14",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "rapidocr-onnxruntime>=1.3",
  "pillow>=10",
  "tzdata>=2024.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
# torch is installed separately (CPU or CUDA wheel index); see docs/windows_setup.md
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
desktop = [
  "PySide6-Essentials>=6.8,<7", "qrcode[pil]>=8,<9", "pyinstaller>=6.10,<7",
  "winrt-Windows.Networking.Connectivity; sys_platform == 'win32'",
  "winrt-Windows.Networking.NetworkOperators; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
]

[project.scripts]
attendx = "attendx.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attendx*"]

[tool.setuptools.package-data]
attendx = ["migrations/*.py", "migrations/versions/*.py", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs the real face model files (skipped when absent)",
  "slow: OCR / model inference",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"attendx/migrations/versions/*" = ["E501", "I001", "UP", "W291"]
"attendx/routers/*" = ["E501"]
